<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineList — Watchlist Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Decorative Light Orbs -->
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <!-- Header Navigation -->
  <header>
    <div class="container header-content">
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </div>
        <span class="brand-text">CINE<span>LIST</span></span>
      </div>

      <div class="api-pill">
        <span class="pulse-dot"></span>
        <label for="apiKey">API KEY</label>
        <input type="password" id="apiKey" value="movie-class-2026" placeholder="x-api-key">
      </div>
    </div>
  </header>

  <main class="container">

    <!-- Search & Filter Bar -->
    <section class="glass-card filter-section">
      <div class="section-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <h2>Filter Collection</h2>
      </div>

      <form class="filter-controls">
        <div class="input-field">
          <input type="text" id="search" placeholder="Search title...">
        </div>

        <div class="input-field">
          <input type="text" id="genre" placeholder="Genre (e.g. Sci-Fi)">
        </div>

        <div class="input-field">
          <select id="watched">
            <option value="">All Statuses</option>
            <option value="true">Watched</option>
            <option value="false">Unwatched</option>
          </select>
        </div>

        <button type="button" class="btn btn-gradient">Filter</button>
      </form>
    </section>

    <!-- Main Workspace Grid -->
    <div class="workspace-grid">

      <!-- Add Movie Sidebar -->
      <aside class="glass-card form-sidebar">
        <div class="section-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <h2>Add Movie</h2>
        </div>

        <form>
          <div class="form-group">
            <label for="title">Title *</label>
            <input type="text" id="title" placeholder="e.g. Interstellar" required>
          </div>

          <div class="form-group">
            <label for="movieGenre">Genre *</label>
            <input type="text" id="movieGenre" placeholder="e.g. Sci-Fi" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="rating">Rating (1-5)</label>
              <input type="number" id="rating" min="1" max="5" value="5">
            </div>

            <div class="form-group checkbox-group">
              <label class="custom-toggle">
                <input type="checkbox" id="isWatched">
                <span class="toggle-slider"></span>
                <span class="toggle-label">Watched</span>
              </label>
            </div>
          </div>

          <button type="submit" class="btn btn-primary-glow">Add To Watchlist</button>
        </form>
      </aside>

      <!-- Movie List Section -->
      <section class="watchlist-container">
        <div class="watchlist-header">
          <h2>Watchlist</h2>
          <span class="counter-badge">3 Movies</span>
        </div>

        <div class="cards-grid">

          <!-- Card 1 -->
          <article class="movie-card watched">
            <div class="card-glow"></div>
            <div class="card-content">
              <div class="card-top">
                <h3>Interstellar</h3>
                <span class="chip chip-watched">Watched</span>
              </div>
              <div class="card-meta">
                <span class="chip chip-genre">Sci-Fi</span>
                <div class="rating-stars">★★★★★</div>
              </div>
              <div class="card-actions">
                <button class="action-btn toggle-btn">Toggle Status</button>
                <button class="action-btn delete-btn">Delete</button>
              </div>
            </div>
          </article>

          <article class="movie-card unwatched">
            <div class="card-glow"></div>
            <div class="card-content">
              <div class="card-top">
                <h3>The Godfather</h3>
                <span class="chip chip-unwatched">Unwatched</span>
              </div>
              <div class="card-meta">
                <span class="chip chip-genre">Crime</span>
                <div class="rating-stars">★★★★★</div>
              </div>
              <div class="card-actions">
                <button class="action-btn toggle-btn">Toggle Status</button>
                <button class="action-btn delete-btn">Delete</button>
              </div>
            </div>
          </article>


          <article class="movie-card watched">
            <div class="card-glow"></div>
            <div class="card-content">
              <div class="card-top">
                <h3>Arrival</h3>
                <span class="chip chip-watched">Watched</span>
              </div>
              <div class="card-meta">
                <span class="chip chip-genre">Sci-Fi</span>
                <div class="rating-stars">★★★★☆</div>
              </div>
              <div class="card-actions">
                <button class="action-btn toggle-btn">Toggle Status</button>
                <button class="action-btn delete-btn">Delete</button>
              </div>
            </div>
          </article>

        </div>
      </section>

    </div>
  </main>

</body>
</html>
